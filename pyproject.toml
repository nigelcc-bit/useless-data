[project]
name = "ai-selloff-study"
version = "0.1.0"
description = "Pre-registered equity research programme (core library + dated studies)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "requests>=2.32",
    "pyarrow>=17.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "linearmodels>=6.0", "arch>=7.0"]

[project.scripts]
ai-selloff-monitor = "src.monitor.leadership:main"
reproduce-fixtures = "src.reproduce_nov5:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "studies/2026-11-flush-or-regime"]
include = ["core*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests", "studies/2026-11-flush-or-regime/tests"]
pythonpath = [".", "studies/2026-11-flush-or-regime"]
addopts = "-q"
