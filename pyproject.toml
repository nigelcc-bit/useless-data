[project]
name = "ai-selloff-study"
version = "0.1.0"
description = "Pre-registered tests: was 5 Nov 2026 a flush or a regime change?"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "linearmodels>=6.0", "arch>=7.0"]

[project.scripts]
ai-selloff-monitor = "src.monitor.leadership:main"
reproduce-fixtures = "src.studies.reproduce_nov5:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
