name: tests

on:
  push:
  pull_request:

jobs:
  bear-trap-study:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studies/2026-11-testing-nasdaq-bear-trap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: studies/2026-11-testing-nasdaq-bear-trap/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
